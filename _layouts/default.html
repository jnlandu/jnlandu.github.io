<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {%- feed_meta -%}
  {%- include google-analytics.html -%}
  <link rel="icon" href="{{ '/profile2.png' | relative_url }}" type="image/png">
  <script>
    // Apply the saved theme before paint to avoid a flash.
    try {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/simple.css' | relative_url }}">
  {% include katex.html %}
</head>
<body>
  <header class="site-header">
    <h1><a href="{{ '/' | relative_url }}">Jeremie N. Mabiala</a></h1>
    <p class="tagline">Machine learning, ML infrastructure &amp; MLOps, and optimization</p>
  </header>

  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
    <a href="{{ '/#publications' | relative_url }}">Publications</a>
    <a href="{{ '/posts/' | relative_url }}" {% if page.url contains '/posts/' or page.url contains '/tags/' %}class="active"{% endif %}>Blog</a>
    <a href="{{ '/news/' | relative_url }}" {% if page.url contains '/news/' %}class="active"{% endif %}>News</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    © {{ 'now' | date: "%Y" }} Jeremie N. Mabiala · <a href="#">Back to top</a>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      function isDark() {
        var t = root.getAttribute('data-theme');
        return t ? t === 'dark' : prefersDark.matches;
      }
      function render() {
        btn.textContent = isDark() ? '☀ Light' : '☾ Dark';
        btn.setAttribute('aria-pressed', isDark());
      }
      btn.addEventListener('click', function () {
        var next = isDark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        render();
      });
      prefersDark.addEventListener('change', render);
      render();
    })();
  </script>
</body>
</html>
