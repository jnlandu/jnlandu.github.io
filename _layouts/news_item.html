---
layout: default
---
<article>
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}
  </p>

  {{ content }}

  {% if page.gallery and page.gallery.size > 0 %}
  <div class="gallery">
    {% for img in page.gallery %}
      <a href="{{ img | relative_url }}"><img loading="lazy" src="{{ img | relative_url }}" alt="Photo {{ forloop.index }} for {{ page.title | escape }}"></a>
    {% endfor %}
  </div>
  {% endif %}
</article>

<p class="post-nav"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
